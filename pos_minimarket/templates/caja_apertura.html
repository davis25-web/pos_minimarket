{% extends "_base.html" %}
{% block content %}
<div class="card" style="max-width:420px; margin:2rem auto; text-align:center;">
  <h2>🔓 Apertura de caja</h2>
  <p style="color:#6b7280;">Antes de empezar a vender, indica con cuánto efectivo abres la caja hoy.</p>
  <form method="POST" style="text-align:left;">
    <div class="field" style="margin-bottom:1rem;">
      <label>Monto inicial en efectivo (S/)</label>
      <input type="number" step="0.10" name="monto_apertura" required autofocus placeholder="0.00">
    </div>
    <button type="submit" style="width:100%;">Aperturar caja</button>
  </form>
</div>
{% endblock %}
