{% extends "_base.html" %}
{% block content %}
<div class="card" style="max-width:420px; margin: 0 auto;">
  <h2>Cambiar contraseña</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ 'error' if category=='error' else '' }}"
           style="{{ 'background:#dcfce7;color:#16a34a;' if category=='success' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="field" style="margin-bottom:1rem;">
      <label>Contraseña actual</label>
      <input type="password" name="actual" required>
    </div>
    <div class="field" style="margin-bottom:1rem;">
      <label>Nueva contraseña (mínimo 6 caracteres)</label>
      <input type="password" name="nueva" required minlength="6">
    </div>
    <div class="field" style="margin-bottom:1rem;">
      <label>Confirmar nueva contraseña</label>
      <input type="password" name="confirmar" required minlength="6">
    </div>
    <button type="submit" style="width:100%;">Actualizar contraseña</button>
  </form>
</div>
{% endblock %}
